name: Tests

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: Check PHP syntax
        run: >-
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0
          | xargs -0 -n1 -P4 php -d display_errors=stderr -l > /dev/null

  phpunit:
    name: PHPUnit on MariaDB 11.8
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: eastproperty_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_VERSION: '7.1.2'
      POLYLANG_VERSION: '3.8.6'
      SCF_VERSION: '6.9.5'
      WP_TESTS_DB_NAME: eastproperty_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1:3306
    defaults:
      run:
        working-directory: wordpress/wp-content/themes/east-property
    steps:
      - uses: actions/checkout@v5
        with:
          path: wordpress/wp-content/themes/east-property

      - name: Download WordPress, Polylang and Secure Custom Fields
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar -xz --strip-components=1 -C wordpress
          curl -fsSL -o polylang.zip "https://downloads.wordpress.org/plugin/polylang.${POLYLANG_VERSION}.zip"
          curl -fsSL -o scf.zip "https://downloads.wordpress.org/plugin/secure-custom-fields.${SCF_VERSION}.zip"
          unzip -q polylang.zip -d wordpress/wp-content/plugins
          unzip -q scf.zip -d wordpress/wp-content/plugins

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mysqli
          coverage: none
          tools: composer

      - name: Install test dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --order-by=random

  build:
    name: Front-end build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build
